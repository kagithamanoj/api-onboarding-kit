# Generated by: onboard ci-init. Validates every consumer spec on pull request.
name: onboarding-ci

on:
  pull_request:
    paths:
      - "specs/**"
      - "policies/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install api-onboarding-kit
        run: pip install api-onboarding-kit

      - name: Validate consumer specs
        run: |
          set -e
          for spec in specs/*.yaml; do
            echo "validating $spec"
            onboard validate "$spec"
          done

      - name: Render check (all gateways)
        run: |
          set -e
          for spec in specs/*.yaml; do
            for gw in apim apigee gcp aws; do
              onboard render "$spec" --gateway "$gw" --out-dir /tmp/render-check
            done
          done
