[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "api-onboarding-kit"
version = "1.0.0"
description = "Self-service API consumer onboarding: declare requirements in YAML, get versioned gateway configs, validated in CI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Manoj Kumar Kagitha" }]
dependencies = [
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "click>=8.1",
  "cryptography>=41.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
onboard = "onboarding.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["onboarding*"]
