apiVersion: onboarding/v1
consumer:
  name: payments-team
  contact: team-payments@example.com
  environments:
    dev:
      backend: https://payments.dev.internal
    staging:
      backend: https://payments.staging.internal
    prod:
      backend: https://payments.prod.internal
      expectedRps: 200
      burstRps: 500
traffic:
  expectedRps: 50
  burstRps: 150
auth:
  method: oauth2
policies:
  - rate-limit:standard
  - cors:default
  - auth:jwt-required
certificates:
  domains: [api.example.com]
  autoRenew: true
